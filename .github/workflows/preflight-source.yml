name: Preflight source-build fallback
on: workflow_dispatch
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: jmarji
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish reusable source dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slicer-source
          target: deps
          push: true
          tags: jmarji/preflight-slicer:source-deps-${{ hashFiles('deps/**', 'cmake/**', 'Dockerfile.slicer-source') }}
          cache-from: type=registry,ref=jmarji/preflight-slicer:source-deps-cache
          cache-to: type=registry,ref=jmarji/preflight-slicer:source-deps-cache,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slicer-source
          push: true
          tags: jmarji/preflight-slicer:source-${{ github.sha }}
          build-args: DEPS_IMAGE=jmarji/preflight-slicer:source-deps-${{ hashFiles('deps/**', 'cmake/**', 'Dockerfile.slicer-source') }}
          cache-from: type=registry,ref=jmarji/preflight-slicer:source-cache
          cache-to: type=registry,ref=jmarji/preflight-slicer:source-cache,mode=max
