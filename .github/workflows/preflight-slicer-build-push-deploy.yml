name: preFlight Slicer Build Push Deploy

on:
  push:
    branches:
      - fleet-slicer-integration
      - slice-container
      - develop
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag override using short commit SHA by default
        required: false
        default: ""
        type: string
      registry_namespace:
        description: Docker registry namespace
        required: false
        default: jmarji
        type: string
      deploy_namespace:
        description: Kubernetes namespace
        required: false
        default: fleet
        type: string
      run_deploy:
        description: Run deploy job when manually triggered
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: preflight-slicer
  BUILD_CONTEXT: .
  DOCKERFILE_PATH: Dockerfile.slicer
  K8S_MANIFEST_PATH: k8s/preflight-slicer.yaml
  DEPLOYMENT_NAME: preflight-slicer
  CONTAINER_NAME: preflight-slicer

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install aiohttp pytest pytest-asyncio
      - run: python -m pytest slicer_service -q

  # Routine builds use the checksum-verified upstream release and cached runtime.
  build-push:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      deploy_namespace: ${{ steps.meta.outputs.deploy_namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(jq -r '.inputs.tag // empty' "$GITHUB_EVENT_PATH")"
          REGISTRY_NAMESPACE="$(jq -r '.inputs.registry_namespace // empty' "$GITHUB_EVENT_PATH")"
          DEPLOY_NAMESPACE="$(jq -r '.inputs.deploy_namespace // empty' "$GITHUB_EVENT_PATH")"

          if [[ -z "$TAG" ]]; then
            TAG="${GITHUB_SHA:0:12}"
          fi
          if [[ -z "$REGISTRY_NAMESPACE" ]]; then
            REGISTRY_NAMESPACE="jmarji"
          fi
          if [[ -z "$DEPLOY_NAMESPACE" ]]; then
            DEPLOY_NAMESPACE="fleet"
          fi

          {
            echo "registry_namespace=$REGISTRY_NAMESPACE"
            echo "deploy_namespace=$DEPLOY_NAMESPACE"
            echo "image_ref=$REGISTRY_NAMESPACE/$IMAGE_NAME:$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DOCKERFILE_PATH"
          test -f "$K8S_MANIFEST_PATH"
          test -f slicer_service/app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jmarji
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64
          build-args: SOURCE_REV=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.registry_namespace }}/preflight-slicer:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.registry_namespace }}/preflight-slicer:buildcache,mode=max
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.registry_namespace }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' || github.event.inputs.run_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          LKE_KUBECONFIG: ${{ secrets.LKE_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "$LKE_KUBECONFIG" ]]; then
            echo "Missing required secret: LKE_KUBECONFIG"
            exit 1
          fi
          mkdir -p "$HOME/.kube"

          if printf '%s' "$LKE_KUBECONFIG" | grep -q 'apiVersion:'; then
            printf '%s\n' "$LKE_KUBECONFIG" > "$HOME/.kube/config"
          elif ! printf '%s' "$LKE_KUBECONFIG" | base64 --decode > "$HOME/.kube/config" 2>/dev/null; then
            echo "LKE_KUBECONFIG is neither raw kubeconfig nor valid base64"
            exit 1
          fi

          chmod 600 "$HOME/.kube/config"

      # Fleet Manager and both slicer workers share this token. Whichever worker
      # deploys first generates it inside the cluster; an existing token is kept.
      - name: Ensure shared worker token
        shell: bash
        run: |
          set -euo pipefail
          NAMESPACE="${{ needs.build-push.outputs.deploy_namespace }}"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          if ! kubectl -n "$NAMESPACE" get secret fleet-slicer-secrets >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" create secret generic fleet-slicer-secrets \
              --from-literal=worker-token="$(openssl rand -hex 32)"
            # Fleet Manager reads the optional token only at pod start.
            if kubectl -n "$NAMESPACE" get deployment fleet-manager >/dev/null 2>&1; then
              kubectl -n "$NAMESPACE" rollout restart deployment/fleet-manager
              kubectl -n "$NAMESPACE" rollout status deployment/fleet-manager --timeout=600s
            fi
          fi

      - name: Deploy preFlight slicer
        shell: bash
        env:
          IMAGE_REF: ${{ needs.build-push.outputs.image_ref }}
          NAMESPACE: ${{ needs.build-push.outputs.deploy_namespace }}
        run: |
          set -euo pipefail

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          # Apply the final image once. Creating :latest and then changing its
          # image starts two rollouts and needlessly occupies a second pod slot.
          sed -e "s|namespace: fleet|namespace: ${NAMESPACE}|g" \
              -e "s|image: jmarji/preflight-slicer:latest|image: ${IMAGE_REF}|" \
              "$K8S_MANIFEST_PATH" | kubectl apply -f -

          if ! kubectl rollout status "deployment/${DEPLOYMENT_NAME}" -n "$NAMESPACE" --timeout=600s; then
            echo "Preflight rollout failed; collecting scheduling, readiness and container diagnostics."
            kubectl get deployment,replicaset,pods -n "$NAMESPACE" -l app=preflight-slicer -o wide || true
            kubectl describe deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" || true
            kubectl describe pods -n "$NAMESPACE" -l app=preflight-slicer || true
            kubectl logs -n "$NAMESPACE" -l app=preflight-slicer --all-containers --tail=100 --prefix=true || true
            exit 1
          fi

      - name: Show preFlight slicer status
        shell: bash
        run: |
          set -euo pipefail
          NAMESPACE="${{ needs.build-push.outputs.deploy_namespace }}"
          kubectl get deployment,service,pods -n "$NAMESPACE" -l app=preflight-slicer -o wide
